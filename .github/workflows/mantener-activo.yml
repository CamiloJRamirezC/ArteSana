# Visita la app cada 3 días para que Supabase no pause la base por inactividad
# (el plan gratuito la pausa tras 7 días sin uso).
# Configuración: en GitHub > Settings > Secrets and variables > Actions > Variables,
# creá la variable APP_URL con la dirección de tu app (ej. https://artesana.onrender.com).
name: Mantener activa la base

on:
  schedule:
    - cron: "17 13 */3 * *"   # 10:17 hora de Paraguay, cada 3 días
  workflow_dispatch: {}

jobs:
  visitar:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar /salud (la primera visita despierta Render, puede tardar ~1 minuto)
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --max-time 120 "${{ vars.APP_URL }}/salud"
